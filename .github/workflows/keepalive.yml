# biologybyamra сайтыг үргэлж сэрүүн байлгах (Render үнэгүй хувилбар 15 минут хэрэглээгүй бол унтдаг).
# Өдөр бүр, 24 цагийн турш 10 минут тутам сайт руу жижиг хүсэлт илгээнэ.
# Анхаар: энэ нь Render-ийн сарын үнэгүй 750 цагийн ~744 цагийг зарцуулна.
name: Сайтыг сэрүүн байлгах
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}          # GitHub дээрээс гараар ажиллуулж болно
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: biologybyamra руу хүсэлт илгээх
        run: curl -fsS --max-time 90 --retry 2 https://biologybyamra.onrender.com/api/public || true
