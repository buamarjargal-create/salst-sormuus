# biologybyamra сайтыг хичээлийн цагаар унтуулахгүй байлгах (Render үнэгүй хувилбар 15 минут хэрэглээгүй бол унтдаг).
# Даваа–Баасан, Улаанбаатарын цагаар 07:00–17:00 хооронд 10 минут тутам сайт руу жижиг хүсэлт илгээнэ.
# Бүтэн өдөржин биш зөвхөн хичээлийн цагаар ажиллах нь Render-ийн сарын үнэгүй 750 цагийг хэмнэнэ.
name: Сайтыг сэрүүн байлгах
on:
  schedule:
    - cron: '*/10 23 * * 0-4'   # UTC 23:00–23:59 = УБ 07:00–07:59 (Даваа–Баасан)
    - cron: '*/10 0-8 * * 1-5'  # UTC 00:00–08:59 = УБ 08:00–16:59 (Даваа–Баасан)
  workflow_dispatch: {}          # GitHub дээрээс гараар ажиллуулж болно
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: biologybyamra руу хүсэлт илгээх
        run: curl -fsS --max-time 90 --retry 2 https://biologybyamra.onrender.com/api/public || true
